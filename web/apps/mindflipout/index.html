<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindFlipOut Simulator</title>
  <link rel="stylesheet" href="../../css/styles.css">
</head>
<body class="mfo-body">
  <main class="mfo-app" aria-label="MindFlipOut web simulator">
    <header class="mfo-header">
      <button class="mfo-logo-btn" type="button" aria-label="MindFlipOut logo">
        <img class="mfo-logo-light" src="../../assets/mindflipout/app-logo-light.png" alt="">
        <img class="mfo-logo-dark" src="../../assets/mindflipout/app-logo-dark.png" alt="">
      </button>
      <div class="mfo-wordmark" aria-label="MindFlipOut">
        <span class="thin">Mind</span><span class="bold">Flip</span><span class="thin">Out</span>
      </div>
      <button class="mfo-company-btn" type="button" aria-label="MINDBEBOP">
        <img class="mfo-company-light" src="../../assets/company/company-logo-light.png" alt="">
        <img class="mfo-company-dark" src="../../assets/company/company-logo-dark.png" alt="">
      </button>
    </header>

    <section class="mfo-search-row" aria-hidden="true">
      <div class="mfo-search-pill">
        <span class="mfo-search-icon">⌕</span>
      </div>
    </section>

    <section class="mfo-toggle-wrap" aria-label="Polarity toggle">
      <button id="tabHeavy" class="mfo-tab is-active" type="button">Heavy</button>
      <button id="tabLight" class="mfo-tab" type="button">Light</button>
    </section>

    <section class="mfo-flip-panel">
      <button id="flipBtn" class="mfo-btn mfo-btn-secondary" type="button" hidden>Flip</button>
    </section>

    <section class="mfo-composer-wrap">
      <section class="mfo-composer">
        <label id="composerLabel" class="mfo-label" for="composerInput">Heavy</label>
        <textarea
          id="composerInput"
          class="mfo-input"
          placeholder="What's on your mind?"
        ></textarea>
      </section>
    </section>

    <section class="mfo-actions">
      <button id="enterBtn" class="mfo-btn mfo-btn-primary" type="button" disabled>Enter</button>
    </section>

    <section class="mfo-list-wrap" aria-label="MindFlipOut list">
      <p id="mfoEmptyState" class="mfo-empty">No entries yet</p>
      <ul id="mfoList" class="mfo-list" hidden></ul>
    </section>

    <footer class="mfo-footer">
      <a class="sim-home-link" href="../../index.html">Back to simulator home</a>
    </footer>
  </main>

  <script>
    "use strict";

    (function () {
      const tabHeavy = document.getElementById("tabHeavy");
      const tabLight = document.getElementById("tabLight");
      const composerLabel = document.getElementById("composerLabel");
      const composerInput = document.getElementById("composerInput");
      const flipBtn = document.getElementById("flipBtn");
      const enterBtn = document.getElementById("enterBtn");
      const listEl = document.getElementById("mfoList");
      const emptyEl = document.getElementById("mfoEmptyState");

      const thoughts = {
        heavy: "",
        light: ""
      };
      let activeTab = "heavy";
      let entries = [];
      let nextEntryId = 1;
      let draftPairId = null;

      function focusAndSelectComposerText() {
        requestAnimationFrame(function () {
          composerInput.focus();
          const len = composerInput.value.length;
          if (len > 0) {
            composerInput.setSelectionRange(0, len);
          }
        });
      }

      function formatCreatedAt(date) {
        return date.toLocaleString(undefined, {
          year: "numeric",
          month: "short",
          day: "numeric",
          hour: "numeric",
          minute: "2-digit"
        });
      }

      function renderList() {
        listEl.innerHTML = "";
        if (!entries.length) {
          emptyEl.hidden = false;
          listEl.hidden = true;
          return;
        }

        emptyEl.hidden = true;
        listEl.hidden = false;

        const side = activeTab === "heavy" ? "heavy" : "light";
        entries
          .slice()
          .sort(function (a, b) { return b.createdAt - a.createdAt; })
          .forEach(function (entry) {
            const li = document.createElement("li");
            li.className = "mfo-list-item";

            const text = (entry[side] || "").trim();
            const contentText = text || (side === "heavy" ? "(No Heavy note yet)" : "(No Light note yet)");

            li.innerHTML = (
              '<div class="mfo-item-main">' +
                '<span class="mfo-item-dot ' + (side === "heavy" ? "heavy" : "light") + '" aria-hidden="true"></span>' +
                '<p class="mfo-item-text">' + contentText.replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</p>" +
              "</div>" +
              '<p class="mfo-item-time">' + formatCreatedAt(entry.createdAt) + "</p>"
            );
            listEl.appendChild(li);
          });
      }

      function syncComposer() {
        composerInput.value = thoughts[activeTab];
        composerLabel.textContent = activeTab === "heavy" ? "Heavy" : "Light";
        const hasText = composerInput.value.trim().length > 0;
        enterBtn.disabled = !hasText;
        flipBtn.hidden = !hasText;
      }

      function setTab(nextTab) {
        thoughts[activeTab] = composerInput.value;
        activeTab = nextTab;
        tabHeavy.classList.toggle("is-active", activeTab === "heavy");
        tabLight.classList.toggle("is-active", activeTab === "light");
        syncComposer();
        renderList();
      }

      composerInput.addEventListener("input", function () {
        thoughts[activeTab] = composerInput.value;
        syncComposer();
      });

      tabHeavy.addEventListener("click", function () {
        setTab("heavy");
      });

      tabLight.addEventListener("click", function () {
        setTab("light");
      });

      flipBtn.addEventListener("click", function () {
        thoughts[activeTab] = composerInput.value;
        if (activeTab === "heavy") {
          thoughts.light = thoughts.heavy;
          setTab("light");
          focusAndSelectComposerText();
        } else {
          setTab("heavy");
        }
      });

      enterBtn.addEventListener("click", function () {
        thoughts[activeTab] = composerInput.value;
        if (!thoughts[activeTab].trim()) return;

        const side = activeTab === "heavy" ? "heavy" : "light";
        let target = null;

        if (draftPairId !== null) {
          target = entries.find(function (e) { return e.id === draftPairId; }) || null;
        }

        if (!target) {
          target = {
            id: nextEntryId++,
            createdAt: new Date(),
            heavy: "",
            light: ""
          };
          entries.push(target);
          draftPairId = target.id;
        }

        target[side] = thoughts[activeTab].trim();

        if (target.heavy.trim() && target.light.trim()) {
          draftPairId = null;
        }

        thoughts[activeTab] = "";
        syncComposer();
        renderList();
      });

      syncComposer();
      renderList();
    }());
  </script>
</body>
</html>
